[project]
name = "multi-agent-api"
version = "0.2.0"
description = "Backend API for the Multi-Agent platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2.0",
    "bcrypt>=4.2,<5.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.116,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "pyjwt>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["B008"]
